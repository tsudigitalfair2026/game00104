<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ワニVSドラゴン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
font-family:sans-serif;
background:#1a1a2e;
color:#fff;
}
.screen{
display:none;
width:100%;
height:100vh;
padding:12px;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}
.active{display:flex;}
h1{margin:10px 0;font-size:2rem;}
p{line-height:1.5;}
button{
border:none;
border-radius:14px;
padding:16px;
font-size:1.1rem;
font-weight:bold;
cursor:pointer;
min-height:60px;
}
#startBtn,#restartBtn{
width:80%;
max-width:320px;
background:#00c853;
color:white;
}
#gameScreen{
justify-content:flex-start;
padding:10px;
}
.topbar{
display:flex;
justify-content:space-between;
width:100%;
font-size:1.1rem;
font-weight:bold;
margin-bottom:8px;
}
.arena{
width:100%;
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:8px;
}
.characters{
display:flex;
justify-content:space-between;
align-items:center;
width:100%;
}
.char{
width:48%;
padding:10px;
border-radius:12px;
background:rgba(255,255,255,0.08);
}
.emoji{
font-size:4rem;
}
.hpbar{
height:18px;
background:#333;
border-radius:10px;
overflow:hidden;
margin-top:6px;
}
.hp{
height:100%;
background:lime;
width:100%;
transition:.25s;
}
#log{
height:58px;
width:100%;
font-size:.95rem;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:6px;
}
.controls{
width:100%;
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
}
.action{
color:white;
font-size:1rem;
}
.attack{background:#e53935;}
.defend{background:#1e88e5;}
.heal{background:#43a047;}
#charge{
width:100%;
height:14px;
background:#333;
border-radius:10px;
overflow:hidden;
margin-top:4px;
}
#chargeFill{
height:100%;
width:0%;
background:gold;
}
.rank{
font-size:2rem;
font-weight:bold;
color:gold;
}
@media (max-width:480px){
.emoji{font-size:3.3rem;}
button{font-size:1rem;}
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
<h1>🐊 ワニ VS 🐉 ドラゴン</h1>
<p>
80秒以内にドラゴンを倒そう！<br>
攻撃・防御・回復を選択して戦うバトルゲーム。<br>
防御中はダメージ半減。<br>
攻撃ボタン長押しで必殺ゲージがたまり、離すと強力攻撃！
</p>
<button id="startBtn">ゲームスタート</button>
</div>

<div id="gameScreen" class="screen">
<div class="topbar">
<div>スコア: <span id="score">0</span></div>
<div>残り <span id="time">80</span> 秒</div>
</div>

<div class="arena">
<div class="characters">
<div class="char">
<div>あなた</div>
<div class="emoji">🐊</div>
<div>HP <span id="playerHpText">100</span></div>
<div class="hpbar"><div id="playerHp" class="hp"></div></div>
</div>

<div class="char">
<div>ボス</div>
<div class="emoji">🐉</div>
<div>HP <span id="bossHpText">180</span></div>
<div class="hpbar"><div id="bossHp" class="hp"></div></div>
</div>
</div>

<div id="log">ドラゴンを倒せ！</div>

<div>
必殺ゲージ
<div id="charge"><div id="chargeFill"></div></div>
</div>
</div>

<div class="controls">
<button class="action attack" id="attackBtn">⚔ 攻撃</button>
<button class="action defend" id="defendBtn">🛡 防御</button>
<button class="action heal" id="healBtn">💚 回復</button>
</div>
</div>

<div id="resultScreen" class="screen">
<h1>結果発表</h1>
<div>最終スコア</div>
<h2 id="finalScore">0</h2>
<div class="rank" id="rank">C</div>
<button id="restartBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const logEl=document.getElementById("log");

const playerHpBar=document.getElementById("playerHp");
const bossHpBar=document.getElementById("bossHp");
const playerHpText=document.getElementById("playerHpText");
const bossHpText=document.getElementById("bossHpText");

const chargeFill=document.getElementById("chargeFill");

let playerHp,bossHp,score,timeLeft,timer;
let defending=false;
let charge=0;
let chargeTimer=null;
let gameOver=false;

const BOSS_MAX_HP=180;

function show(screen){
[startScreen,gameScreen,resultScreen].forEach(s=>s.classList.remove("active"));
screen.classList.add("active");
}

function updateUI(){
playerHp=Math.max(0,playerHp);
bossHp=Math.max(0,bossHp);

playerHpText.textContent=Math.floor(playerHp);
bossHpText.textContent=Math.floor(bossHp);

playerHpBar.style.width=playerHp+"%";
bossHpBar.style.width=(bossHp/BOSS_MAX_HP*100)+"%";

scoreEl.textContent=score;
chargeFill.style.width=charge+"%";
}

function bossTurn(){
if(gameOver)return;

let action=Math.random();

if(action<0.72){
let dmg=Math.floor(Math.random()*12)+8;
if(defending)dmg=Math.floor(dmg/2);
playerHp-=dmg;
logEl.textContent="🐉 ドラゴンの攻撃！ -" + dmg;
}else{
let heal=Math.floor(Math.random()*8)+5;
bossHp=Math.min(BOSS_MAX_HP,bossHp+heal);
logEl.textContent="🐉 ドラゴンが回復！ +" + heal;
}

defending=false;
updateUI();
checkEnd();
}

function attack(power=1){
if(gameOver)return;

let dmg=Math.floor(Math.random()*18)+18;

if(power>1){
dmg=Math.floor(dmg+power*0.7);
}

bossHp-=dmg;
score+=dmg*2;

logEl.textContent="🐊 攻撃！ -" + dmg;

updateUI();
checkEnd();

if(!gameOver)setTimeout(bossTurn,300);
}

function defend(){
if(gameOver)return;

defending=true;
score+=5;

logEl.textContent="🛡 防御態勢！";

setTimeout(bossTurn,300);
}

function heal(){
if(gameOver)return;

let healVal=Math.floor(Math.random()*18)+18;

playerHp=Math.min(100,playerHp+healVal);
score+=3;

logEl.textContent="💚 回復！ +" + healVal;

updateUI();

setTimeout(bossTurn,300);
}

function checkEnd(){
if(bossHp<=0){
score+=1000+timeLeft*10;
endGame(true);
}
if(playerHp<=0){
endGame(false);
}
}

function endGame(clear){
gameOver=true;

clearInterval(timer);
clearInterval(chargeTimer);

show(resultScreen);

document.getElementById("finalScore").textContent=score;

let rank="C";

if(score>=1800) rank="S";
else if(score>=1300) rank="A";
else if(score>=900) rank="B";

if(!clear && score<900) rank="D";

document.getElementById("rank").textContent=
(clear?"🏆 ":"💀 ")+rank;
}

function startGame(){
playerHp=100;
bossHp=BOSS_MAX_HP;
score=0;
timeLeft=80;
charge=0;
gameOver=false;

updateUI();

timeEl.textContent=timeLeft;
logEl.textContent="戦闘開始！";

show(gameScreen);

timer=setInterval(()=>{
timeLeft--;
timeEl.textContent=timeLeft;

if(timeLeft<=0){
if(bossHp<=0){
endGame(true);
}else{
score+=Math.max(0,BOSS_MAX_HP-bossHp);
endGame(false);
}
}
},1000);
}

document.getElementById("startBtn").onclick=startGame;
document.getElementById("restartBtn").onclick=startGame;

const attackBtn=document.getElementById("attackBtn");

function startCharge(e){
e.preventDefault();

if(gameOver)return;

charge=0;
chargeFill.style.width="0%";

clearInterval(chargeTimer);

chargeTimer=setInterval(()=>{
charge=Math.min(100,charge+5);
chargeFill.style.width=charge+"%";
},35);
}

function releaseAttack(e){
e.preventDefault();

if(gameOver)return;

clearInterval(chargeTimer);

if(charge<20){
attack(1);
}else{
attack(charge);
}

charge=0;
chargeFill.style.width="0%";
}

["mousedown","touchstart"].forEach(ev=>{
attackBtn.addEventListener(ev,startCharge,{passive:false});
});

["mouseup","mouseleave","touchend","touchcancel"].forEach(ev=>{
attackBtn.addEventListener(ev,releaseAttack,{passive:false});
});

document.getElementById("defendBtn").addEventListener("click",defend);
document.getElementById("healBtn").addEventListener("click",heal);
</script>

</body>
</html>
